<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: head('로그인')}"></head>

<body class="auth-page">

<main class="auth-shell">
    <div class="auth-brand">
        <span class="brand-mark">
            <i class="bi bi-kanban"></i>
        </span>
        <span>MiniPM</span>
    </div>

    <section class="surface-card auth-card">
        <h1 class="auth-title">로그인</h1>
        <p class="auth-description">
            프로젝트와 이슈를 한곳에서 관리하세요.
        </p>

        <div th:if="${message}"
             class="app-alert app-alert-success"
             role="status">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${message}">회원가입이 완료되었습니다.</span>
        </div>

        <div th:if="${param.error}"
             class="app-alert app-alert-danger"
             role="alert">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>아이디 또는 비밀번호를 확인해주세요.</span>
        </div>

        <div th:if="${param.oauthError}"
             class="app-alert app-alert-danger"
             role="alert">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>카카오 로그인 처리 중 오류가 발생했습니다.</span>
        </div>

        <div th:if="${param.logout}"
             class="app-alert app-alert-success"
             role="status">
            <i class="bi bi-check-circle-fill"></i>
            <span>안전하게 로그아웃되었습니다.</span>
        </div>

        <form th:action="@{/member/login}"
              method="post">

            <div class="mb-3">
                <label for="loginId"
                       class="form-label">
                    로그인 아이디
                </label>

                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-person text-secondary"></i>
                    </span>

                    <input type="text"
                           id="loginId"
                           name="loginId"
                           class="form-control border-start-0"
                           placeholder="아이디를 입력해주세요."
                           autocomplete="username"
                           required
                           autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password"
                       class="form-label">
                    비밀번호
                </label>

                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-lock text-secondary"></i>
                    </span>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control border-start-0"
                           placeholder="비밀번호를 입력해주세요."
                           autocomplete="current-password"
                           required>
                </div>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                로그인
            </button>
        </form>

        <div class="social-divider">
            <span>또는</span>
        </div>

        <a th:href="@{/oauth2/authorization/kakao}"
           class="btn kakao-login-btn w-100">
            <i class="bi bi-chat-fill me-2"></i>
            카카오로 로그인
        </a>

        <p class="auth-footer">
            아직 계정이 없나요?
            <a th:href="@{/member/join}">회원가입</a>
        </p>
    </section>
</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>

</body>
</html>
