<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: head('회원가입')}"></head>

<body class="auth-page">

<main class="auth-shell">
    <div class="auth-brand">
        <span class="brand-mark">
            <i class="bi bi-kanban"></i>
        </span>
        <span>MiniPM</span>
    </div>

    <section class="surface-card auth-card">
        <h1 class="auth-title">회원가입</h1>
        <p class="auth-description">
            MiniPM에서 프로젝트 관리를 시작하세요.
        </p>

        <form th:action="@{/member/join}"
              th:object="${memberJoinDTO}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="app-alert app-alert-danger"
                 role="alert">
                <i class="bi bi-exclamation-circle-fill"></i>

                <div>
                    <p th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}"
                       class="mb-0">
                        회원가입 오류
                    </p>
                </div>
            </div>

            <div class="mb-3">
                <label for="loginId"
                       class="form-label">
                    로그인 아이디
                </label>

                <input type="text"
                       id="loginId"
                       th:field="*{loginId}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('loginId')} ? ' is-invalid' : ''"
                       placeholder="사용할 아이디를 입력해주세요."
                       autocomplete="username">

                <p th:if="${#fields.hasErrors('loginId')}"
                   th:errors="*{loginId}"
                   class="field-error">
                    아이디 오류
                </p>
            </div>

            <div class="mb-3">
                <label for="password"
                       class="form-label">
                    비밀번호
                </label>

                <input type="password"
                       id="password"
                       th:field="*{password}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''"
                       placeholder="4자 이상의 비밀번호를 입력해주세요."
                       autocomplete="new-password">

                <p th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}"
                   class="field-error">
                    비밀번호 오류
                </p>
            </div>

            <div class="mb-3">
                <label for="name"
                       class="form-label">
                    이름
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                       placeholder="이름을 입력해주세요."
                       autocomplete="name">

                <p th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"
                   class="field-error">
                    이름 오류
                </p>
            </div>

            <div class="mb-4">
                <label for="email"
                       class="form-label">
                    이메일
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"
                       placeholder="name@example.com"
                       autocomplete="email">

                <p th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"
                   class="field-error">
                    이메일 오류
                </p>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                회원가입
            </button>
        </form>

        <p class="auth-footer">
            이미 계정이 있나요?
            <a th:href="@{/member/login}">로그인</a>
        </p>
    </section>
</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>

</body>
</html>
