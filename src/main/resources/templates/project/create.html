<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: head('새 프로젝트 생성')}"></head>

<body>

<header th:replace="~{fragments/common :: header}"></header>
<th:block th:replace="~{fragments/common :: sidebar('create')}"></th:block>

<main class="app-main">
    <div class="content-wrap" style="max-width: 820px;">

        <nav class="breadcrumb-wrap" aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/project}">내 프로젝트</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    새 프로젝트 생성
                </li>
            </ol>
        </nav>

        <div class="page-heading">
            <div>
                <h1 class="page-title">새 프로젝트 생성</h1>
                <p class="page-description">
                    프로젝트 이름과 설명을 입력해 새로운 작업 공간을 만듭니다.
                </p>
            </div>
        </div>

        <section class="surface-card">
            <div class="surface-card-body">
                <form th:action="@{/project/create}"
                      th:object="${projectCreateDTO}"
                      method="post">

                    <div class="mb-4">
                        <label for="name" class="form-label">
                            프로젝트 이름 <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                               maxlength="100"
                               placeholder="예: MiniPM UI 개선">

                        <p th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}"
                           class="field-error">
                            프로젝트 이름 오류
                        </p>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">
                            프로젝트 설명
                        </label>

                        <textarea id="description"
                                  th:field="*{description}"
                                  class="form-control"
                                  rows="6"
                                  placeholder="프로젝트의 목적과 주요 작업을 간단히 설명해주세요."></textarea>

                        <p class="help-text">
                            참여자가 프로젝트의 목적을 이해할 수 있도록 작성해주세요.
                        </p>
                    </div>

                    <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
                        <a th:href="@{/project}"
                           class="btn btn-outline-secondary px-4">
                            취소
                        </a>

                        <button type="submit"
                                class="btn btn-primary px-4">
                            프로젝트 생성
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>

</body>
</html>
