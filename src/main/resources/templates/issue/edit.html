<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('이슈 수정')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<aside th:replace="~{fragments/common :: sidebar('projects')}"></aside>

<main class="app-main">
    <div class="container-fluid px-0 form-page-wrap">
        <nav class="page-breadcrumb" aria-label="breadcrumb">
            <a th:href="@{/project}">프로젝트</a><i class="bi bi-chevron-right"></i>
            <a th:href="@{/project/{projectId}/issues(projectId=${projectId})}">이슈</a>
            <i class="bi bi-chevron-right"></i><span>수정</span>
        </nav>

        <div class="page-heading">
            <div><p class="page-eyebrow">EDIT ISSUE</p><h1>이슈 수정</h1>
                <p>이슈의 내용과 분류, 담당자를 변경할 수 있습니다.</p></div>
        </div>

        <section class="surface-card form-card">
            <form th:action="@{/project/{projectId}/issues/{issueId}/edit(projectId=${projectId}, issueId=${issueId})}"
                  th:object="${issueUpdateDTO}" method="post">
                <div class="mb-4">
                    <label for="title" class="form-label">이슈 제목 <span class="required-mark">*</span></label>
                    <input type="text" id="title" th:field="*{title}" maxlength="200" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''" placeholder="이슈 제목">
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="invalid-feedback">제목 오류</div>
                </div>

                <div class="mb-4">
                    <label for="content" class="form-label">이슈 내용</label>
                    <textarea id="content" th:field="*{content}" rows="8" class="form-control"
                              th:classappend="${#fields.hasErrors('content')} ? ' is-invalid' : ''"
                              placeholder="이슈 내용을 입력하세요"></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="invalid-feedback">내용 오류</div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-4">
                        <label for="issueType" class="form-label">유형 <span class="required-mark">*</span></label>
                        <select id="issueType" th:field="*{issueType}" class="form-select"
                                th:classappend="${#fields.hasErrors('issueType')} ? ' is-invalid' : ''">
                            <option value="">선택하세요</option><option value="FEATURE">기능</option>
                            <option value="BUG">버그</option><option value="TASK">작업</option><option value="IMPROVEMENT">개선</option>
                        </select>
                        <div th:if="${#fields.hasErrors('issueType')}" th:errors="*{issueType}" class="invalid-feedback">유형 오류</div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="priority" class="form-label">우선순위 <span class="required-mark">*</span></label>
                        <select id="priority" th:field="*{priority}" class="form-select"
                                th:classappend="${#fields.hasErrors('priority')} ? ' is-invalid' : ''">
                            <option value="">선택하세요</option><option value="HIGH">높음</option>
                            <option value="MEDIUM">보통</option><option value="LOW">낮음</option>
                        </select>
                        <div th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}" class="invalid-feedback">우선순위 오류</div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="assigneeId" class="form-label">담당자</label>
                        <select id="assigneeId" th:field="*{assigneeId}" class="form-select"
                                th:classappend="${#fields.hasErrors('assigneeId')} ? ' is-invalid' : ''">
                            <option value="">미지정</option>
                            <option th:each="member : ${members}" th:value="${member.memberId}"
                                    th:text="|${member.name} (${member.loginId})|">담당자</option>
                        </select>
                        <div th:if="${#fields.hasErrors('assigneeId')}" th:errors="*{assigneeId}" class="invalid-feedback">담당자 오류</div>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/project/{projectId}/issues/{issueId}(projectId=${projectId}, issueId=${issueId})}"
                       class="btn btn-outline-secondary">취소</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 수정 저장</button>
                </div>
            </form>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
