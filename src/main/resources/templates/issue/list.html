<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('이슈 목록')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>
<aside th:replace="~{fragments/common :: sidebar('projects')}"></aside>

<main class="app-main">
    <div class="container-fluid px-0">
        <nav class="page-breadcrumb" aria-label="breadcrumb">
            <a th:href="@{/project}">프로젝트</a><i class="bi bi-chevron-right"></i>
            <a th:href="@{/project/{projectId}(projectId=${project.projectId})}" th:text="${project.name}">프로젝트</a>
            <i class="bi bi-chevron-right"></i><span>이슈</span>
        </nav>

        <div class="page-heading">
            <div>
                <p class="page-eyebrow">ISSUE BOARD</p>
                <h1 th:text="|${project.name} 이슈|">프로젝트 이슈</h1>
                <p>프로젝트의 작업을 검색하고 진행 상태를 확인하세요.</p>
            </div>
            <a th:href="@{/project/{projectId}/issues/create(projectId=${project.projectId})}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> 새 이슈
            </a>
        </div>

        <div th:replace="~{fragments/common :: alerts}"></div>

        <section class="surface-card search-card mb-4">
            <form th:action="@{/project/{projectId}/issues(projectId=${project.projectId})}"
                  th:object="${issueSearchDTO}" method="get">
                <input type="hidden" name="page" value="1">
                <input type="hidden" name="size" th:value="${pageResponse.size}">

                <div class="row g-3 align-items-end">
                    <div class="col-12 col-xl-4">
                        <label for="keyword" class="form-label">제목 또는 내용</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="search" id="keyword" th:field="*{keyword}" maxlength="100"
                                   class="form-control" th:classappend="${#fields.hasErrors('keyword')} ? ' is-invalid' : ''"
                                   placeholder="검색어를 입력하세요">
                        </div>
                        <div th:if="${#fields.hasErrors('keyword')}" th:errors="*{keyword}"
                             class="invalid-feedback d-block">검색어 오류</div>
                    </div>

                    <div class="col-6 col-md-3 col-xl-2">
                        <label for="issueType" class="form-label">유형</label>
                        <select id="issueType" th:field="*{issueType}" class="form-select">
                            <option value="">전체</option><option value="FEATURE">기능</option>
                            <option value="BUG">버그</option><option value="TASK">작업</option>
                            <option value="IMPROVEMENT">개선</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-3 col-xl-2">
                        <label for="status" class="form-label">상태</label>
                        <select id="status" th:field="*{status}" class="form-select">
                            <option value="">전체</option><option value="TODO">할 일</option>
                            <option value="IN_PROGRESS">진행 중</option><option value="DONE">완료</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-3 col-xl-2">
                        <label for="priority" class="form-label">우선순위</label>
                        <select id="priority" th:field="*{priority}" class="form-select">
                            <option value="">전체</option><option value="HIGH">높음</option>
                            <option value="MEDIUM">보통</option><option value="LOW">낮음</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-3 col-xl-2">
                        <label for="assigneeId" class="form-label">담당자</label>
                        <select id="assigneeId" th:field="*{assigneeId}" class="form-select">
                            <option value="">전체</option>
                            <option th:each="member : ${members}" th:value="${member.memberId}"
                                    th:text="|${member.name} (${member.loginId})|">담당자</option>
                        </select>
                    </div>

                    <div class="col-12 d-flex flex-wrap gap-2 justify-content-end">
                        <a th:href="@{/project/{projectId}/issues(projectId=${project.projectId})}"
                           class="btn btn-outline-secondary">초기화</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> 검색</button>
                    </div>
                </div>
            </form>
        </section>

        <div class="section-title-row">
            <h2>이슈 목록</h2>
            <span class="result-count">총 <strong th:text="${pageResponse.total}">0</strong>건</span>
        </div>

        <div th:if="${#lists.isEmpty(issues)}" class="surface-card empty-state">
            <i class="bi bi-inbox"></i><h2>조건에 맞는 이슈가 없습니다</h2>
            <p>검색 조건을 바꾸거나 새 이슈를 등록해 보세요.</p>
        </div>

        <section th:unless="${#lists.isEmpty(issues)}" class="surface-card p-0 overflow-hidden d-none d-lg-block">
            <div class="table-responsive">
                <table class="table app-table align-middle mb-0">
                    <thead><tr><th>번호</th><th>제목</th><th>유형</th><th>우선순위</th><th>상태</th><th>작성자</th><th>담당자</th><th>작성일</th></tr></thead>
                    <tbody>
                    <tr th:each="issue : ${issues}">
                        <td class="text-secondary" th:text="${issue.issueId}">1</td>
                        <td><a th:href="@{/project/{projectId}/issues/{issueId}(projectId=${project.projectId}, issueId=${issue.issueId})}"
                               th:text="${issue.title}" class="table-title-link">이슈 제목</a></td>
                        <td><span class="neutral-badge" th:text="${issue.issueType}">BUG</span></td>
                        <td><span class="neutral-badge" th:text="${issue.priority}">HIGH</span></td>
                        <td><span class="neutral-badge" th:classappend="${issue.status == 'DONE'} ? ' status-done' : ''"
                                  th:text="${issue.status}">TODO</span></td>
                        <td th:text="|${issue.reporterName} (${issue.reporterLoginId})|">작성자</td>
                        <td>
                            <span th:if="${issue.assigneeId != null}" th:text="|${issue.assigneeName} (${issue.assigneeLoginId})|">담당자</span>
                            <span th:unless="${issue.assigneeId != null}" class="text-secondary">미지정</span>
                        </td>
                        <td class="text-secondary text-nowrap"
                            th:text="${issue.createdAt != null ? #temporals.format(issue.createdAt, 'yyyy-MM-dd') : '-'}">작성일</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section th:unless="${#lists.isEmpty(issues)}" class="d-lg-none issue-mobile-list">
            <a th:each="issue : ${issues}"
               th:href="@{/project/{projectId}/issues/{issueId}(projectId=${project.projectId}, issueId=${issue.issueId})}"
               class="surface-card issue-mobile-card">
                <div class="d-flex justify-content-between gap-3 align-items-start">
                    <div><span class="text-secondary small" th:text="|#${issue.issueId}|">#1</span>
                        <h2 th:text="${issue.title}">이슈 제목</h2></div>
                    <span class="neutral-badge" th:classappend="${issue.status == 'DONE'} ? ' status-done' : ''"
                          th:text="${issue.status}">TODO</span>
                </div>
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <span class="neutral-badge" th:text="${issue.issueType}">BUG</span>
                    <span class="neutral-badge" th:text="${issue.priority}">HIGH</span>
                </div>
                <div class="issue-mobile-meta">
                    <span><i class="bi bi-person"></i>
                        <span th:if="${issue.assigneeId != null}" th:text="${issue.assigneeName}">담당자</span>
                        <span th:unless="${issue.assigneeId != null}">미지정</span>
                    </span>
                    <span th:text="${issue.createdAt != null ? #temporals.format(issue.createdAt, 'yyyy-MM-dd') : '-'}">작성일</span>
                </div>
            </a>
        </section>

        <nav th:if="${pageResponse.total > 0 and pageResponse.end >= pageResponse.start}"
             class="app-pagination" aria-label="이슈 페이지">
            <a th:if="${pageResponse.prev}"
               th:href="@{/project/{projectId}/issues(projectId=${project.projectId}, page=${pageResponse.start - 1}, size=${pageResponse.size}, keyword=${issueSearchDTO.keyword}, issueType=${issueSearchDTO.issueType}, status=${issueSearchDTO.status}, priority=${issueSearchDTO.priority}, assigneeId=${issueSearchDTO.assigneeId})}"
               class="page-button" aria-label="이전 페이지"><i class="bi bi-chevron-left"></i></a>
            <a th:each="pageNumber : ${#numbers.sequence(pageResponse.start, pageResponse.end)}"
               th:href="@{/project/{projectId}/issues(projectId=${project.projectId}, page=${pageNumber}, size=${pageResponse.size}, keyword=${issueSearchDTO.keyword}, issueType=${issueSearchDTO.issueType}, status=${issueSearchDTO.status}, priority=${issueSearchDTO.priority}, assigneeId=${issueSearchDTO.assigneeId})}"
               th:text="${pageNumber}" th:classappend="${pageNumber == pageResponse.page} ? ' active' : ''"
               class="page-button">1</a>
            <a th:if="${pageResponse.next}"
               th:href="@{/project/{projectId}/issues(projectId=${project.projectId}, page=${pageResponse.end + 1}, size=${pageResponse.size}, keyword=${issueSearchDTO.keyword}, issueType=${issueSearchDTO.issueType}, status=${issueSearchDTO.status}, priority=${issueSearchDTO.priority}, assigneeId=${issueSearchDTO.assigneeId})}"
               class="page-button" aria-label="다음 페이지"><i class="bi bi-chevron-right"></i></a>
        </nav>
    </div>
</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
